runtime: python311

# 2 workers × 8 threads ≈ best fit for F2 (512MB / 1 core) for a mostly
# I/O-bound app. Drop to 1 worker if you see OOM under load.
entrypoint: gunicorn -b :$PORT --workers 2 --threads 8 --timeout 60 main:app

instance_class: F2

# Values that must not be in this public repo: copy secrets.example.yaml to secrets.yaml and fill it in.
# `gcloud app deploy` refuses to run if secrets.yaml is missing, instead of deploying a broken contact form.
includes:
  - secrets.yaml

env_variables:
  # Single source of truth — local path or gs:// URL. That's it.
  SITES_MASTER_CSV: "gs://advitia-weighbridge-data/dashboard_config/sites_master.csv"

  # /reports page only — dashboard no longer calls this.
  RECORDS_API_BASE: "https://weighbridge-api-asia-south1-287877277037.asia-south1.run.app/"

  # CSV is re-read once per cache window.
  CACHE_TTL_SECONDS: "1800"

  # Synthetic today_mt ticker rate (cards 3 & 7).
  TODAY_MT_RATE_PER_HOUR: "200"

  # RDF expected = pct × target (cards 2 & 6).
  RDF_EXPECTED_PCT: "0.15"

  PROJECT_DEADLINE: "2026-05-31"
  ROTATION_INTERVAL_MS: "12000"

  # REQUIRED. Generate once with: python -c "import secrets; print(secrets.token_hex(32))"
  # and paste the result below. If you'd rather not commit it, comment this
  # line out and use Secret Manager (see deploy notes).
  SECRET_KEY: "289c9278d43d1961d48652f9a9c4f059b9ac554e9df36bb782ce4b3157a51d6b"

  TH_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyesxPy3PgSYEYwYjhAjL3aAyEsgNGABxFT0N5c-LH818O6mlA87qY5yM9P0AmqQtio5g/exec"
  TH_SCRIPT_TOKEN: "rbfeN7PhkRL73Gesx71pTG6oUyLrX4ESpO-xao1kO7A"
  AP_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbz38G9cMS5FiJMV34x1Zb8vsUYIidcKYhHekW8lrAAYAS6VNKXyVkC6fEaupDXs/exec"
  AP_SCRIPT_TOKEN: "zwu2Jzj11avXuzTR1jw0zFbejg6ftLvh6qh3HkiOt9s"

  # /rdf_planning — fill both after deploying apps_script/rdf_planning (docs/rdf-planning.md).
  # Until RDF_SCRIPT_URL is set the form shows "backend is not configured".
  RDF_SCRIPT_URL: ""
  RDF_SCRIPT_TOKEN: ""

  # /rdf_report (rdf.advitiaum.com) — daily tracker CSVs + PIN hash live here (docs/rdf-report.md).
  RDF_TRACKER_DIR: "gs://advitia-weighbridge-data/rdf_report"
  RDF_DEADLINE: "2026-11-15"

  # Landing page contact form + visit/white-paper tracker: LANDING_SCRIPT_URL, LANDING_SCRIPT_TOKEN
  # and IPINFO_TOKEN are NOT here. They live in secrets.yaml (git-ignored, see secrets.example.yaml
  # and docs/landing.md), so a fresh clone or `git pull` can no longer deploy them empty.

  # /TTD dashboard (docs/ttd-dashboard.md). The read key is NOT put here: it is read from
  # Secret Manager by the App Engine service account. Until ADEX_API_URL is set, /TTD shows
  # "not configured" after sign-in.
  ADEX_API_URL: ""
  TTD_SITE_ID: "ttd"
  TTD_READ_KEY_SECRET: ""   # e.g. projects/YOUR_PROJECT/secrets/ttd-read-key/versions/latest
  TTD_AWARDED_MT: "51290"

automatic_scaling:
  min_instances: 1
  max_instances: 4
  target_cpu_utilization: 0.65

handlers:
  # Landing page (/ and /main) assets. CSS/JS are fetched with ?v=<content hash>
  # (views/landing.py), so a long cache is safe; fonts/vendor/img never change
  # in place. Must stay above the generic /static handler.
  - url: /static/landing
    static_dir: static/landing
    secure: always
    expiration: "7d"
    http_headers:
      X-Content-Type-Options: nosniff
  # /peshi builder assets: fetched with ?v=<content hash> (views/peshi.py), so cache long.
  - url: /static/peshi
    static_dir: static/peshi
    secure: always
    expiration: "7d"
    http_headers:
      X-Content-Type-Options: nosniff
  - url: /static
    static_dir: static
    secure: always
  - url: /.*
    script: auto
    secure: always



