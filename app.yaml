runtime: python311

entrypoint: gunicorn -b :$PORT main:app

instance_class: F2

env_variables:
  # Single source of truth — local path or gs:// URL. That's it.
  SITES_MASTER_CSV: "gs://advitia-weighbridge-data/dashboard_config/sites_master.csv"

  # /reports page only — dashboard no longer calls this.
  RECORDS_API_BASE: "https://weighbridge-api-mzfbv433ja-as.a.run.app"

  # CSV is re-read once per cache window.
  CACHE_TTL_SECONDS: "1800"

  # Synthetic today_mt ticker rate (cards 3 & 7).
  TODAY_MT_RATE_PER_HOUR: "200"

  # RDF expected = pct × target (cards 2 & 6).
  RDF_EXPECTED_PCT: "0.15"

  PROJECT_DEADLINE: "2026-05-31"
  ROTATION_INTERVAL_MS: "12000"

automatic_scaling:
  min_instances: 1
  max_instances: 4
  target_cpu_utilization: 0.65

handlers:
  - url: /static
    static_dir: static
    secure: always
  - url: /.*
    script: auto
    secure: always
