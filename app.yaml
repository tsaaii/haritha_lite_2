runtime: python311

# 2 workers × 8 threads ≈ best fit for F2 (512MB / 1 core) for a mostly
# I/O-bound app. Drop to 1 worker if you see OOM under load.
entrypoint: gunicorn -b :$PORT --workers 2 --threads 8 --timeout 60 main:app

instance_class: F2

env_variables:
  # Single source of truth — local path or gs:// URL. That's it.
  SITES_MASTER_CSV: "gs://advitia-weighbridge-data/dashboard_config/sites_master.csv"

  # /reports page only — dashboard no longer calls this.
  RECORDS_API_BASE: "https://weighbridge-api-asia-south1-287877277037.asia-south1.run.app/"

  # CSV is re-read once per cache window.
  CACHE_TTL_SECONDS: "1800"

  # Synthetic today_mt ticker rate (cards 3 & 7).
  TODAY_MT_RATE_PER_HOUR: "200"

  # RDF expected = pct × target (cards 2 & 6).
  RDF_EXPECTED_PCT: "0.15"

  PROJECT_DEADLINE: "2026-05-31"
  ROTATION_INTERVAL_MS: "12000"

  # REQUIRED. Generate once with: python -c "import secrets; print(secrets.token_hex(32))"
  # and paste the result below. If you'd rather not commit it, comment this
  # line out and use Secret Manager (see deploy notes).
  SECRET_KEY: "289c9278d43d1961d48652f9a9c4f059b9ac554e9df36bb782ce4b3157a51d6b"

  TH_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyesxPy3PgSYEYwYjhAjL3aAyEsgNGABxFT0N5c-LH818O6mlA87qY5yM9P0AmqQtio5g/exec"
  TH_SCRIPT_TOKEN: "rbfeN7PhkRL73Gesx71pTG6oUyLrX4ESpO-xao1kO7A"
  AP_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbz38G9cMS5FiJMV34x1Zb8vsUYIidcKYhHekW8lrAAYAS6VNKXyVkC6fEaupDXs/exec"
  AP_SCRIPT_TOKEN: "zwu2Jzj11avXuzTR1jw0zFbejg6ftLvh6qh3HkiOt9s"

automatic_scaling:
  min_instances: 1
  max_instances: 4
  target_cpu_utilization: 0.65

handlers:
  - url: /static
    static_dir: static
    secure: always
  - url: /.*
    script: auto
    secure: always



