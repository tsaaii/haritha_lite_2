<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A202C" />
  <title>{% block title %}Swachha Andhra Dashboard{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
</head>

<body>
    <!-- hover-to-reveal login bar -->
  <div class="top-login-bar">
    <a href="/login" class="top-login-bar__btn">Login</a>
  </div>

  <div class="public-layout" data-theme="dark">
    {% include "partials/hero.html" %}

    <main class="main-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="layout-footer">
      <span>Last updated: {{ updated_at }}</span>
      <span class="footer-sep">•</span>
      <span>All rights reserved by Swachha Andhra Corporation,Andhra Pradesh. Built by Advitia Labs.</span>
    </footer>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
