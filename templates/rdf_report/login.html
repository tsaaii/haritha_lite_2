<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B3D22">
<title>RDF disposal report · Sign in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='rdf_report/report.css') }}">
</head>
<body>
<main class="pin-shell">
  <section class="pin-card" aria-labelledby="pin-title">
    <div class="rh__left">
      <span class="rh__org">Swachha Andhra Corporation</span>
      <span class="rh__title" id="pin-title">RDF disposal report</span>
    </div>
    {% if error %}<div class="msg msg--err" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('rdf_report.login') }}" autocomplete="off" novalidate>
      <input type="hidden" name="next" value="{{ request.path }}">
      <input type="hidden" name="captcha_nonce" value="{{ captcha_nonce }}">
      <label>Enter PIN
        <input class="pin-input" type="password" name="pin" inputmode="numeric" autocomplete="current-password"
               maxlength="12" required autofocus>
      </label>
      <label><span>Security check: what is <b class="c9">{{ captcha_question }}</b>?</span>
        <input class="cap-input" name="captcha_answer" inputmode="numeric" autocomplete="off" required pattern="-?[0-9]*">
      </label>
      <button type="submit" class="btn btn--primary">Open report</button>
    </form>
    <p class="fine">Five wrong tries lock sign-in for 15 minutes.</p>
  </section>
</main>
</body>
</html>
