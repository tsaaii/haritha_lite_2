<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B3D22">
<title>RDF disposal report{% if r %} · {{ r.rep_label }}{% endif %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='rdf_report/report.css') }}">
<script id="rdf-report-config" type="application/json">{{ cfg | tojson }}</script>
</head>
<body>
<div class="page">
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="toolbar" data-noprint>
    <a href="{{ url_for('rdf_report.logout') }}">Sign out</a>
    <div class="toolbar__right">
      <button type="button" class="icon-btn" id="gear" title="Upload daily tracker" aria-label="Upload daily tracker">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <a class="btn btn--primary" id="pdf" href="{{ pdf_url }}" download{% if not r %} hidden{% endif %}>Save as PDF</a>
    </div>
  </div>

  {% if load_error %}<div class="alert" data-noprint>{{ load_error }}</div>{% endif %}

  <div id="sheet-slot" class="sheet-slot">{% include "rdf_report/_sheet.html" %}</div>
</div>

<dialog class="panel" id="panel" aria-labelledby="panel-title">
  <div class="panel__head">
    <h2 id="panel-title">Daily trackers</h2>
    <button type="button" class="icon-btn" id="panel-close" aria-label="Close">✕</button>
  </div>
  <div class="panel__body">
    <label class="drop" id="drop">
      <input type="file" id="files" accept=".csv,text/csv" multiple hidden>
      <span>Upload the daily RDF tracker CSV</span>
      <small>Picking a file updates the report and downloads its PDF straight away. Each sheet is filed under its "as on" date; uploading the same date again replaces it.</small>
    </label>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="days">
      <h3>Days on file</h3>
      <div id="days"><small class="c5">Loading…</small></div>
    </div>
  </div>
</dialog>

<script src="{{ url_for('static', filename='rdf_report/report.js') }}" defer></script>
</body>
</html>
