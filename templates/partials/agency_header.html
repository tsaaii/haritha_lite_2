<section class="agency-header" aria-live="polite" aria-label="Current agency">
  <button type="button" class="agency-header__nav agency-header__nav--prev" aria-label="Previous agency">‹</button>

  {% for agency in agencies %}
    <div class="agency-header__slide{% if loop.first %} is-active{% endif %}"
         data-agency="{{ agency.name }}"
         data-index="{{ loop.index0 }}">
      <div class="agency-header__inner">
        <span class="agency-header__name">{{ agency.display_name }}</span>
        <span class="agency-header__sep" aria-hidden="true">•</span>
        <span class="agency-header__meta">{{ agency.site_count }} site{{ '' if agency.site_count == 1 else 's' }}</span>
        <span class="agency-header__sep" aria-hidden="true">•</span>
        <span class="agency-header__meta">{{ agency.cluster_count }} cluster{{ '' if agency.cluster_count == 1 else 's' }}</span>
      </div>
    </div>
  {% endfor %}

  <button type="button" class="agency-header__nav agency-header__nav--next" aria-label="Next agency">›</button>
</section>
