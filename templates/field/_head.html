<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="{{ brand.color }}">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ brand.org }}">
<link rel="manifest" href="{{ manifest_url }}">
<link rel="icon" href="{{ logo_url }}">
<link rel="apple-touch-icon" href="{{ logo_url }}">
<link rel="stylesheet" href="{{ css_url }}">
<style>
  :root{
    --brand:{{ brand.color }};--brand-dark:{{ brand.color_dark }};--brand-deep:{{ brand.color_deep }};
    --leaf:{{ brand.color_leaf }};--pale:{{ brand.color_pale }};--mint:{{ brand.color_mint }};--mist:{{ brand.color_mist }};
    --ring:{{ brand.color }}4D;--logo-radius:{{ brand.logo_radius }};
  }
</style>
<script id="field-config" type="application/json">
  {{ {"brand": brand.slug, "org": brand.org, "cutoff": brand.cutoff, "api": api,
      "formUrl": form_url, "pendingUrl": pending_url, "swUrl": sw_url} | tojson }}
</script>
