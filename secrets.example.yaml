# Copy to secrets.yaml (git-ignored) next to app.yaml and fill in. app.yaml includes it on every deploy.
#   cp secrets.example.yaml secrets.yaml && nano secrets.yaml
# Never commit secrets.yaml. Details: docs/landing.md -> "Contact form and visit tracker".
env_variables:
  # Apps Script web app: Deploy > Manage deployments > the /exec URL
  LANDING_SCRIPT_URL: "https://script.google.com/macros/s/XXXXXXXX/exec"
  # Must equal CONFIG.TOKEN in the Apps Script (apps_script/landing/Code.gs)
  LANDING_SCRIPT_TOKEN: "paste-the-same-long-random-string"
  # Optional: free token from ipinfo.io, adds the visitor's network name. Leave "" to skip.
  IPINFO_TOKEN: ""
